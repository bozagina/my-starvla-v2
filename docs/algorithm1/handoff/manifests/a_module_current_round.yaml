    VDPM/FASA branch has been merged into mainline (000ef49). A-module now supports
    mode=fusion (VDPM in-loop + CrossAttentionFusionAHead). A-BUILD must sync,
    smoke test fusion mode, and re-evaluate CP-AH-4 before CP thread can unblock.
