  - thread_id: CP-REVIEW
    role: REVIEW
    current_gate: phase3_0b_cp_fusion_review
    owner: OC
    status: PENDING
    note: >
      等待 CP-BUILD fusion mode 交付后审核。需审核：
      (1) ENG-1~4 工程修复质量
      (2) CP-AH-4-v1 多 seed 评估结果
      (3) CP-AH-5 RNG 对齐验证
    previous_verdict: FAIL_AH4
    previous_reviewed_at: "2026-04-16T14:00:00+08:00"
    previous_note: >
      上轮 Round 4 仲裁：-7pp 主要 RNG divergence，p=0.141 不显著，
      200 episodes 统计功效不足。本轮需 multi-seed eval 确认。
    baseline_anchor:
      vlm: qwen25_authoritative
      acceptance_rule: evidence_only
