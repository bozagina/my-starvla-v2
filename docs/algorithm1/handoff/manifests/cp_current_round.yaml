      此分析线程关闭。CP 恢复后需用 fusion A 输出重跑 CP-AH-4。
    resolved_at: "2026-04-17T00:00:00+08:00"
    resolution: "A-module upgraded to fusion mode; upstream signal quality issue addressed"
    blocking_conditions: []
    handoff_to:
      - CP-BUILD

downstream_rule:
  cp_build_start_condition: >
    UNBLOCKED. CP-RES RFC v1.1 (RTC+fusion) 已交付。CP-BUILD 可基于 RFC v1.1 启动。
    需先完成 ARCH-1/2 架构修订和 ENG-1/3/4 工程修复，再进行 fusion mode 多 seed 训练和评估。
  resume_condition: >
    已满足 (2026-04-17)。A-module 完成 VDPM in-loop inference 实现，
    T-B4 fusion AH-4 500step PASS，A-REVIEW Round 5 验收通过。
    CP-RES RFC v1 已交付。
  resume_plan:
    - "CP-BUILD: 解决 ENG-1~4 (信号来源统一、推理适配、RNG 对齐、episode reset)"
    - "CP-BUILD: 决策 BD-6 (信号来源) 和 BD-7 (CF 架构修订)"
    - "CP-BUILD: 用 fusion mode 重新训练 corrective flow (多 seed)"
    - "CP-BUILD: 执行 CP-AH-4-v1 多 seed LIBERO eval"
    - "CP-BUILD: 执行 CP-AH-5 RNG 对齐验证"
    - "CP-REVIEW: 审核全链路证据"
