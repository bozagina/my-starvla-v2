unblocked_at: "2026-04-17T00:00:00+08:00"
previous_block:
  blocked_at: "2026-04-16T22:00:00+08:00"
  blocked_reason: >
    A-module lite 模式信号质量不足，CP-AH-4 FAIL (62% vs 69%)。
    CP 全线程暂停等待 A-module 升级至 VDPM in-loop inference。
  resolved_by: >
    A-module 已完成 VDPM fusion 模式升级。T-B1~T-B4 ALL PASS。
    A-REVIEW Round 5 确认 fusion mode ACCEPTED, A-output USABLE_FOR_DOWNSTREAM。
summary: >
  CP-RES fusion 恢复轮完成（RFC v1.1 RTC 范式修订）。核心架构变化：
  trigger/region 从 CF 模型输入中移除，仅保留为训练时 loss 权重（RTC 范式）。
  推理时 CF 仅依赖 a_prev，完全不需要 A-module / VDPM。消除了 CP-R2-v1（推理
  融合适配）和 CP-R3-v1（VDPM 延迟）两项风险。CP-BUILD 待启动 v1.1 实现。

global_anchors:
  repo_scope: qwen_only
  mainline_vlm: qwen25_authoritative
  progress_log: docs/algorithm1/handoff/progress_live.md
  acceptance_evidence:
    - config.yaml
    - metrics.jsonl
    - summary.jsonl
    - train.log
    - train.raw.log

contracts:
  consume:
    - a_outputs_current_reviewed
  emit:
    - delta_action_v0_draft (updated for fusion)

upstream_gate:
  required_verdict: >
    A-REVIEW must have emitted usable_for_downstream = yes|conditional
    in the A-module current round manifest or progress ledger.
  verdict_source: docs/algorithm1/handoff/manifests/a_module_current_round.yaml
  current_verdict: USABLE
  verdict_detail: >
    A-REVIEW Round 5 (2026-04-16T23:50:00+08:00): PASS, fusion mode ACCEPTED.
    A-output USABLE_FOR_DOWNSTREAM under fusion mode. T-B4 fusion AH-4 500step
    PASS: a_loss -46.4%, 0 NaN/Inf, VDPM 0 failures. Seven-field contract preserved.
    CP threads may resume with fusion-mode A outputs.
  evidence_refs:
    - "a_module_current_round.yaml: threads[A-REVIEW].review_history[round=5].verdict = PASS"
    - "a_module_current_round.yaml: downstream_rule.cp_unblock_decision (2026-04-17)"
    - "a_module_current_round.yaml: downstream_rule.tb4_evidence.verdict = AH-4_PASS"
    - "T-B4 run_id: tb4_fusion_ah4_500step_20260416_113826"
    - "A-module mode: fusion (VDPM in-loop + CrossAttentionFusionAHead)"

threads:
  - thread_id: CP-RES
    role: RES
    current_gate: phase3_0b_cp_fusion_resume
    owner: OC
    status: DONE
    delivered_at: "2026-04-17T02:00:00+08:00"
    delivered_artifacts:
      - "Policy RFC v1.1 (RTC+fusion): docs/algorithm1/handoff/cp_res_policy_rfc_v1_fusion.md"
      - "Interface Assumptions v1.1: docs/algorithm1/handoff/cp_res_interface_assumptions_v1_fusion.md"
      - "Blocked Items v1.1: docs/algorithm1/handoff/cp_res_blocked_items_v1_fusion.md"
    note: >
      Fusion 恢复轮研究完成（v1.1 RTC 范式修订）。核心结论：
      (1) BD-8 新增：trigger/region 从 CF 模型输入中移除，仅保留为训练时 loss 权重
      (2) BD-1 修订：pure additive（a_prev + velocity），去掉 region gate
      (3) BD-3：训练时 fusion，推理时 CF 不依赖 A-module
      (4) BD-7：推荐 self-attention only（去 VLM cross-attention）
      (5) 消除 CP-R2-v1（推理融合适配）和 CP-R3-v1（VDPM 延迟）两项 HIGH/MEDIUM 风险
      (6) 保留 ENG-1（训练信号来源统一）、ENG-3（RNG 对齐）、ENG-4（episode reset）
      (7) CP-AH-4-v1 多 seed 评估 + CP-AH-5 RNG 对齐验证
    previous_delivery:
      round_id: CP-ROUND-BOOTSTRAP-WAIT-UPSTREAM
      date: "2026-04-15T02:00:00+08:00"
      artifacts:
        - "docs/algorithm1/handoff/cp_res_policy_rfc.md (v0)"
        - "docs/algorithm1/handoff/cp_res_interface_assumptions.md (v0)"
        - "docs/algorithm1/handoff/cp_res_blocked_items.md (v0)"
    baseline_anchor:
      vlm: qwen25_authoritative
      a_output_contract: v0.9.3_frozen (fusion mode)
      schema: p1_shared_builder_v1
    allowed_paths:
      - docs/algorithm1/handoff/**
      - docs/starvla_retrofit/handoff/**
      - tools/*audit*.py
    required_artifacts:
      - policy RFC (fusion revision)
      - interface assumptions (fusion update)
      - blocked items (fusion update)
    blocking_conditions: []
    handoff_to:
      - CP-BUILD
      - CP-REVIEW

  - thread_id: CP-BUILD
    role: BUILD
    current_gate: phase3_0b_cp_fusion_build
    owner: OC
    status: IN_PROGRESS
    started_at: "2026-04-17T10:00:00+08:00"
    note: >
      Phase 1-2 完成：CorrectiveFlowHead RTC 改造 + QwenPI 训练/推理路径修改 +
      py_compile 3/3 PASS + 3 个新训练脚本已创建。
      等待远程 500-step smoke test 验证代码正确性后进入多 seed 训练。
    upstream_rfc: docs/algorithm1/handoff/cp_res_policy_rfc_v1_fusion.md (v1.1 RTC)
    required_engineering_tasks:
      - "ARCH-1: CorrectiveFlowHead 架构修订 — 移除 MetadataEncoder 输入、修改 forward/predict 签名"
      - "ARCH-2: BD-7 决策 — 去掉 VLM cross-attention（推荐）或保留作为消融对比"
      - "ENG-1: CF 训练路径 region_logits 统一为 fusion head 实时输出（仅 loss 权重）"
      - "ENG-3: RNG 对齐实现（独立 Generator）"
      - "ENG-4: Episode reset 链路修复（_cf_prev_chunk reset）"
      - "TRAIN: 多 seed 训练（≥3 seeds）fusion baseline + fusion CF"
      - "EVAL: CP-AH-4-v1 多 seed LIBERO eval + CP-AH-5 RNG 对齐验证"
    bd_decisions_pending:
      BD-7: "CF 架构 VLM cross-attention（推荐去掉，可做 A/B 消融）"
    baseline_anchor:
      vlm: qwen25_authoritative
      a_output_contract: v0.9.3_frozen (fusion mode)
      schema: p1_shared_builder_v1
    allowed_paths:
      - starVLA/model/framework/**
      - starVLA/training/**
      - tools/**
      - docs/algorithm1/handoff/**
      - docs/starvla_retrofit/handoff/**
    required_artifacts:
      - config diff
      - local smoke evidence
      - remote smoke evidence
      - changed-file handoff note
    blocking_conditions:
      - "ENG-1~4 需在训练前解决"
    handoff_to:
