run_id: starvla
run_root_dir: path/to/result
seed: 42
trackers: [jsonl, wandb]
wandb_entity: your-wandb-entity
wandb_project: your-wandb-project
is_debug: false

framework:
  name: QwenPI
  qwenvl:
    base_vlm: /2025233147/zzq/SpatialVLA_llava3d/starVLA/playground/Pretrained_models/qwen2.5vl
    attn_implementation: sdpa  # sdpa when flash_attn not installed; use flash_attention_2 after pip install flash-attn
    vl_hidden_dim: 2048  # Qwen2.5-VL-3B; QwenPI overwrites from model at init
  dino:
    dino_backbone: dinov2_vits14
  action_model:
    action_model_type: DiT-B
    action_hidden_dim: 1024
    hidden_size: 1024
    add_pos_embed: true
    max_seq_len: 1024
    action_dim: 7  # libero
    state_dim: 7   # libero
    future_action_window_size: 7
    action_horizon: 8
    past_action_window_size: 0
    repeated_diffusion_steps: 8
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    num_inference_timesteps: 4
    num_target_vision_tokens: 32
    diffusion_model_cfg:
      cross_attention_dim: 2048  # match Qwen2.5-VL-3B vl_hidden_dim
      dropout: 0.1
      final_dropout: true
      interleave_self_attention: true
      norm_type: "ada_norm"
      num_layers: 16
      output_dim: 1024
      positional_embeddings: null
  reduce_in_full_precision: true


datasets:
  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: /2025233147/zzq/SpatialVLA_llava3d/playground/Datasets/LEROBOT_LIBERO_DATA
    data_mix: libero_all # libero_goal
    action_type: delta_qpos
    CoT_prompt: "Your task is {instruction}. To identify the key objects for your task. Locate their bounding boxes in [x1,y1,x2,y2] format."
    CoT_answer: bbox
    default_image_resolution: [3, 224, 224]
    per_device_batch_size: 16
    load_all_data_for_training: true
    obs: ["image_0"]
    video_backend: torchvision_av


trainer:
  epochs: 100
  max_train_steps: 100000
  num_warmup_steps: 5000
  save_interval: 5000
  eval_interval: 100
  learning_rate:
    base: 2.0e-05  # Changed from 2.5e-05 (VLA-Adapter uses 2e-5)
    qwen_vl_interface: 2.0e-05  # Align with base lr (VLA-Adapter doesn't differentiate)
    action_model: 1.0e-04
  lr_scheduler_type: constant  # Changed from cosine_with_min_lr (VLA-Adapter uses "constant")
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: ''
  loss_scale:
    vla: 1.0
    vlm: 1.0 # Increased from 0.1 to 1.0 for VLA-Adapter, for the action query learning
  max_grad_norm: 1.0
  warmup_ratio: 0.1
  weight_decay: 0.0
  logging_frequency: 10
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08

  # parameters to be determined
  save_format: pt  # pt or safetensors
  is_resume: false
  resume_epoch: null
  resume_step: null
  enable_gradient_checkpointing: true
  enable_mixed_precision_training: true
